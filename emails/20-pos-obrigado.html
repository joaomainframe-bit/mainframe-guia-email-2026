<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Post-purchase 1 — thank you" description="Post-purchase, send 1: confirms what is coming, sets the expectation for the first pour. Order items mapped from Placed Order." -->
<helmet><script src="./ds-base.js"></script><style>body{margin:0}</style></helmet>
<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.EmailShell" theme="{{ theme }}" preheader="It's on its way. Here's what to do when it lands." hint-size="100%,100%">

<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.ImageBlock" src="https://www.graza.co/cdn/shop/files/trio-plus_frizzle-spray_f20e9a13-498a-40cd-aa78-e6a851af00d5.jpg" alt="Graza bottles on a counter" ratio="16 / 11" overlay="bottom" align="bottom" logo="{{ true }}" fullBleed="{{ true }}" hint-size="100%,412px">
<div style="display:flex;flex-direction:column;align-items:center;gap:12px">
<p style="font-family:var(--font-display);font-size:14px;letter-spacing:0.14em;text-transform:uppercase;color:#D1E030;margin:0">Order confirmed</p>
<h1 style="font-family:var(--font-display);font-size:34px;line-height:1.08;font-weight:400;text-transform:uppercase;letter-spacing:0.04em;color:#FFF4EC;margin:0;text-wrap:balance">Good call. Now the fun part.</h1>
<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.Button" href="https://graza.co/blogs/glog" size="lg" hint-size="250px,60px">See what to cook first</x-import>
</div>
</x-import>

<!-- ITENS DA ENCOMENDA: variáveis do evento Placed Order -->
<div data-klaviyo-loop="event.extra.line_items"
     data-klaviyo-alias="item"
     data-klaviyo-fields='{"name":"[[ item.product.title ]]","qty":"Quantity: [[ item.quantity|floatformat:0 ]]","price":"$[[ item.line_price|floatformat:2 ]]","size":"[[ item.variant_title ]]","image":"{% if item.product.variant.images.0.src %}[[ item.product.variant.images.0.src ]]{% else %}[[ item.product.images.0.src ]]{% endif %}","href":"[[ organization.url ]]"}'
     style="background:var(--surface-tint);padding:22px 32px;display:grid;gap:14px;border-top:1px solid var(--email-outline);border-bottom:1px solid var(--email-outline)">
<sc-for list="{{ cartItems }}" as="item" hint-placeholder-count="2">
<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.ProductCard" layout="row" href="https://graza.co" name="{{ item.name }}" tagline="{{ item.qty }}" price="{{ item.price }}" size="{{ item.size }}" image="{{ item.image }}" hint-size="100%,116px"></x-import>
</sc-for>
</div>
<!-- FIM ITENS DA ENCOMENDA -->


<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.Transition" label="what happens next" variant="rule" ground="tint" hint-size="100%,44px"></x-import>
<div style="background:var(--surface-email);padding:30px 32px;text-align:center">
<h2 style="font-family:var(--font-display);font-size:24px;line-height:1.18;font-weight:400;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-heading);margin:0 0 16px">What happens next</h2>
<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.StepList" variant="number" steps="{{ steps }}" hint-size="100%,200px"></x-import>
</div>


<div style="background:var(--surface-inverse);color:var(--text-on-inverse);padding:26px 32px 30px;text-align:center">
<p style="font-size:20px;line-height:1.45;margin:0 0 20px;text-wrap:pretty">While it ships, pick what you are making with it first.</p>
<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.Button" href="https://graza.co/blogs/glog" variant="secondary" size="lg" hint-size="260px,60px">Browse the recipes</x-import>
</div>
<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.Footer" hint-size="100%,470px"></x-import>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:600,&quot;height&quot;:1600},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;\&quot;auto\&quot; | \&quot;light\&quot; | \&quot;dark\&quot;&quot;,&quot;section&quot;:&quot;Rendering&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      theme: this.props.theme ?? "auto",
      true: true,
      steps: [
        { title: "It ships", body: "You get a tracking link the moment it leaves." },
        { title: "Open the cap, not the seal", body: "The squeeze top is the point. No decanting." },
        { title: "Use it on something today", body: "Bread, eggs, anything roasting. Don't save it." }
      ],
      cartItems: [
        { name: "Sizzle", qty: "Quantity: 1", price: "$16", size: "750ml", image: "https://www.graza.co/cdn/shop/files/30_product_sizzle750ml_0002_fe965569-a5c7-45ca-8809-47da9aba1e32.jpg" },
        { name: "Drizzle", qty: "Quantity: 1", price: "$21", size: "500ml", image: "https://www.graza.co/cdn/shop/files/driz.jpg" }
      ]
    };
  }
}
</script>
</body>
</html>
