<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Browse email 2 — social proof" description="Browse abandon, send 2: a verified review carries the argument, the viewed product sits under it." -->
<helmet><script src="./ds-base.js"></script><style>body{margin:0}</style></helmet>
<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.EmailShell" theme="{{ theme }}" preheader="What 4,515 people said after they stopped hesitating." hint-size="100%,100%">

<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.ImageBlock" src="https://www.graza.co/cdn/shop/files/graza-home-olive-tree-about-cta_2x_04121622-d9d5-4b12-80f7-3e108daf90ab.jpg" alt="An olive grove in Andalusia" ratio="16 / 9" overlay="bottom" align="bottom" logo="{{ true }}" fullBleed="{{ true }}" hint-size="100%,337px">
<div style="display:flex;flex-direction:column;align-items:center;gap:12px">
<p style="font-family:var(--font-display);font-size:14px;letter-spacing:0.14em;text-transform:uppercase;color:#D1E030;margin:0">4.9 out of 5</p>
<h1 style="font-family:var(--font-display);font-size:34px;line-height:1.08;font-weight:400;text-transform:uppercase;letter-spacing:0.04em;color:#FFF4EC;margin:0;text-wrap:balance">I finally get what the fuss is about</h1>
<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.Button" href="[[ event.URL ]]" size="lg" hint-size="250px,60px">Pick my bottle</x-import>
</div>
</x-import>

<div style="background:var(--surface-inverse);color:var(--text-on-inverse);padding:28px 32px 30px;text-align:center">
<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.ProofQuote" ground="green" quote="This is now my olive oil of choice. Love it." attribution="Michelle · verified review" style="{{ quoteStyle }}" hint-size="100%,180px"></x-import>
<p style="font-size:14px;color:#C9BFB0;margin:18px 0 0">4.9 out of 5 · 4,515 verified reviews</p>
</div>



<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.Transition" label="the one you were looking at" variant="rule" ground="page" hint-size="100%,44px"></x-import>

<!-- PRODUTO VISTO: um so, sem ciclo. Variáveis do evento Viewed Product. -->
<div data-klaviyo-fields='{"name":"[[ event.ProductName|default:event.Product ]]","price":"$[[ event.Price ]]","image":"[[ event.ImageURL ]]","href":"[[ event.URL ]]"}'
     style="background:var(--surface-tint);padding:22px 32px;border-top:1px solid var(--email-outline);border-bottom:1px solid var(--email-outline)">
<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.ProductCard" layout="row" href="https://graza.co/products/sizzle" name="Sizzle" tagline="The one you were looking at" price="$16" image="https://www.graza.co/cdn/shop/files/30_product_sizzle750ml_0002_fe965569-a5c7-45ca-8809-47da9aba1e32.jpg" hint-size="100%,116px"></x-import>
</div>
<!-- FIM PRODUTO VISTO -->

<div style="background:var(--surface-inverse);color:var(--text-on-inverse);padding:28px 32px 32px;text-align:center">
<p style="font-size:20px;line-height:1.45;margin:0 0 20px;text-wrap:pretty">Same bottle. Same price as when you looked.</p>
<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.Button" href="[[ event.URL ]]" variant="secondary" size="lg" hint-size="260px,64px">Pick my bottle</x-import>
</div>

<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.Footer" hint-size="100%,470px"></x-import>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:600,&quot;height&quot;:1600},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;\&quot;auto\&quot; | \&quot;light\&quot; | \&quot;dark\&quot;&quot;,&quot;section&quot;:&quot;Rendering&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      theme: this.props.theme ?? "auto",
      true: true,
      quoteStyle: { background: "transparent", padding: "0" },
      dummy: null
    };
  }
}
</script>
</body>
</html>
