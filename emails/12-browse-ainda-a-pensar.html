<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Browse email 3 — still deciding" description="Browse abandon, send 3: answers the I-do-not-understand-the-difference objection with a comparison table. No A/B variants." -->
<helmet><script src="./ds-base.js"></script><style>body{margin:0}</style></helmet>
<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.EmailShell" theme="{{ theme }}" preheader="The difference between ours and the one on the shelf." hint-size="100%,100%">

<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.ImageBlock" src="https://www.graza.co/cdn/shop/files/squeeze.jpg" alt="A Graza squeeze bottle" ratio="16 / 11" overlay="bottom" align="bottom" logo="{{ true }}" fullBleed="{{ true }}" hint-size="100%,412px">
<div style="display:flex;flex-direction:column;align-items:center;gap:12px">
<p style="font-family:var(--font-display);font-size:14px;letter-spacing:0.14em;text-transform:uppercase;color:#D1E030;margin:0">The honest version</p>
<h1 style="font-family:var(--font-display);font-size:34px;line-height:1.08;font-weight:400;text-transform:uppercase;letter-spacing:0.04em;color:#FFF4EC;margin:0;text-wrap:balance">Why ours costs more than the shelf one</h1>
<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.Button" href="[[ event.URL ]]" size="lg" hint-size="250px,60px">Start with Sizzle</x-import>
</div>
</x-import>

<div style="background:var(--surface-email);padding:30px 32px;text-align:center">
<p style="font-size:20px;line-height:1.5;margin:0 0 22px;text-wrap:pretty">Most supermarket bottles were pressed a year or two ago, blended from wherever was cheap. Here is the whole difference, without the adjectives.</p>

<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.Transition" label="side by side, no adjectives" variant="rule" ground="page" hint-size="100%,44px"></x-import>
<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.CompareTable" columns="{{ columns }}" rows="{{ rows }}" highlight="{{ zero }}" hint-size="100%,260px"></x-import>
</div>

<!-- PRODUTO VISTO: um so, sem ciclo. Variáveis do evento Viewed Product. -->
<div data-klaviyo-fields='{"name":"[[ event.ProductName|default:event.Product ]]","price":"$[[ event.Price ]]","image":"[[ event.ImageURL ]]","href":"[[ event.URL ]]"}'
     style="background:var(--surface-tint);padding:22px 32px;border-top:1px solid var(--email-outline);border-bottom:1px solid var(--email-outline)">
<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.ProductCard" layout="row" href="https://graza.co/products/sizzle" name="Sizzle" tagline="The one you were looking at" price="$16" image="https://www.graza.co/cdn/shop/files/30_product_sizzle750ml_0002_fe965569-a5c7-45ca-8809-47da9aba1e32.jpg" hint-size="100%,116px"></x-import>
</div>
<!-- FIM PRODUTO VISTO -->

<div style="background:var(--surface-inverse);color:var(--text-on-inverse);padding:28px 32px 32px;text-align:center">
<p style="font-size:20px;line-height:1.45;margin:0 0 20px;text-wrap:pretty">Still the entry bottle. Still $16.</p>
<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.Button" href="[[ event.URL ]]" variant="secondary" size="lg" hint-size="260px,64px">Start with Sizzle</x-import>
</div>

<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.Footer" hint-size="100%,470px"></x-import>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:600,&quot;height&quot;:1700},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;\&quot;auto\&quot; | \&quot;light\&quot; | \&quot;dark\&quot;&quot;,&quot;section&quot;:&quot;Rendering&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      theme: this.props.theme ?? "auto",
      true: true,
      zero: 0,
      columns: ["Graza", "Most brands"],
      rows: [
        { label: "Harvest date", values: ["Printed on the bottle", "Not stated"] },
        { label: "Origin", values: ["One region, per pressing", "Blended, multi-country"] },
        { label: "Bottle", values: ["Squeeze, keeps air out", "Glass, open to air"] },
        { label: "What you taste", values: ["Peppery, green, fresh", "Flat"] }
      ],
      dummy: null
    };
  }
}
</script>
</body>
</html>
