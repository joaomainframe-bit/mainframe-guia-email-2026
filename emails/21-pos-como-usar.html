<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Post-purchase 2 — how to use it" description="Post-purchase, send 2: the difference between the bottles, so the second one gets bought for a reason." -->
<helmet><script src="./ds-base.js"></script><style>body{margin:0}</style></helmet>
<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.EmailShell" theme="{{ theme }}" preheader="Sizzle or Drizzle? The rule is simpler than you think." hint-size="100%,100%">

<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.ImageBlock" src="https://www.graza.co/cdn/shop/articles/Traeger_Dad.jpg" alt="Meat searing with olive oil" ratio="16 / 11" overlay="bottom" align="bottom" logo="{{ true }}" fullBleed="{{ true }}" hint-size="100%,412px">
<div style="display:flex;flex-direction:column;align-items:center;gap:12px">
<p style="font-family:var(--font-display);font-size:14px;letter-spacing:0.14em;text-transform:uppercase;color:#D1E030;margin:0">Now you have it</p>
<h1 style="font-family:var(--font-display);font-size:34px;line-height:1.08;font-weight:400;text-transform:uppercase;letter-spacing:0.04em;color:#FFF4EC;margin:0;text-wrap:balance">Heat it or finish with it. Never both.</h1>
<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.Button" href="https://graza.co/blogs/glog" size="lg" hint-size="250px,60px">See the recipes</x-import>
</div>
</x-import>

<div style="background:var(--surface-email);padding:30px 32px;text-align:center">
<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.IconBullets" items="{{ usos }}" hint-size="100%,180px"></x-import>
</div>

<img src="https://www.graza.co/cdn/shop/files/driz.jpg" alt="Drizzle, the finishing bottle" style="width:100%;aspect-ratio:16 / 10;object-fit:cover;display:block">

<div style="background:var(--surface-inverse);color:var(--text-on-inverse);padding:28px 32px 32px;text-align:center">
<p style="font-size:20px;line-height:1.45;margin:0 0 20px;text-wrap:pretty">If you only cook with it, you are using half the bottle you paid for.</p>
<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.Button" href="https://graza.co/products/drizzle" variant="secondary" size="lg" hint-size="270px,64px">Add Drizzle · $21</x-import>
</div>

<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.Footer" hint-size="100%,470px"></x-import>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:600,&quot;height&quot;:1700},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;\&quot;auto\&quot; | \&quot;light\&quot; | \&quot;dark\&quot;&quot;,&quot;section&quot;:&quot;Rendering&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      theme: this.props.theme ?? "auto",
      true: true,
      usos: [
        "Sizzle · the pan, the oven, the grill. It doesn't burn.",
        "Drizzle · the last thing you add. Salad, bread, a finished plate.",
        "Frizzle · anything you fry. Neutral, high heat, no fuss."
      ]
    };
  }
}
</script>
</body>
</html>
