<!DOCTYPE html>
<html>
<head>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Welcome email 4 — last chance" description="Welcome flow, send 4: the bottle full-bleed with the countdown over it, code and CTA in the band under, one line of reminder. Nothing else." -->
<helmet><script src="./ds-base.js"></script><style>body{margin:0}</style></helmet>
<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.EmailShell" theme="{{ theme }}" preheader="Last call on your 15% welcome code." hint-size="100%,100%">

<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.ImageBlock" src="https://www.graza.co/cdn/shop/files/30_product_sizzle750ml_0002_fe965569-a5c7-45ca-8809-47da9aba1e32.jpg" alt="Sizzle, the 750ml everyday bottle" ratio="4 / 3" overlay="full" align="center" logo="{{ true }}" fullBleed="{{ true }}" hint-size="100%,450px">
<div style="display:flex;flex-direction:column;align-items:center;gap:12px">
<p style="font-family:var(--font-display);font-size:14px;letter-spacing:0.14em;text-transform:uppercase;color:#FFF4EC;margin:0">Your code expires</p>
<p style="font-family:var(--font-display);font-size:64px;line-height:1;font-weight:400;letter-spacing:0.04em;text-transform:uppercase;color:#FFF4EC;margin:0;font-variant-numeric:tabular-nums">{{ hoursLeft }} hours</p>
<p style="font-size:20px;line-height:1.4;color:#FFF4EC;margin:0">15% off your first order. Then it's gone.</p>
<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.Button" href="https://graza.co/products/sizzle" size="lg" hint-size="250px,60px">Use my 15% now</x-import>
</div>
</x-import>

<div style="background:var(--surface-accent);color:var(--text-on-accent);padding:26px 32px 30px;text-align:center">
<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.CodeChip" code="{{ offerCode }}" label="Your code" tone="green" labelTone="ink" hint-size="200px,70px"></x-import>
<div style="height:20px"></div>
<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.Button" href="https://graza.co/products/sizzle" size="lg" hint-size="300px,64px">Start with Sizzle · $16</x-import>
</div>


<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.Transition" label="one last thing" variant="rule" ground="page" hint-size="100%,44px"></x-import>
<div style="background:var(--surface-email);padding:26px 32px 30px;text-align:center">
<p style="font-size:20px;line-height:1.5;margin:0">Ours was olives four months ago. Theirs has no date on it.</p>
</div>

<x-import component-from-global-scope="GrazaEmailDesignSystem_755028.Footer" hint-size="100%,470px"></x-import>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:600,&quot;height&quot;:1250},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;\&quot;auto\&quot; | \&quot;light\&quot; | \&quot;dark\&quot;&quot;,&quot;section&quot;:&quot;Rendering&quot;},&quot;offerCode&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;FRESH15&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Offer&quot;},&quot;hoursLeft&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;24&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Offer&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      theme: this.props.theme ?? "auto",
      offerCode: this.props.offerCode ?? "FRESH15",
      hoursLeft: this.props.hoursLeft ?? "24"
    };
  }
}
</script>
</body>
</html>
